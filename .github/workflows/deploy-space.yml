name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "app/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle package for HF Space
        run: |
          cp -r src/dental_model app/

      - name: Push app/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO || 'Bihari04/dental-model-demo' }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          space_repo = os.environ.get("HF_SPACE_REPO", "").strip()

          if not token or not space_repo:
              print("::error::Missing HF_TOKEN or HF_SPACE_REPO secret in GitHub Actions!")
              print("Please add HF_TOKEN and HF_SPACE_REPO under GitHub repo Settings -> Secrets and variables -> Actions.")
              sys.exit(1)

          api = HfApi(token=token)
          try:
              api.create_repo(repo_id=space_repo, repo_type="space", space_sdk="gradio", exist_ok=True)
          except Exception as e:
              print(f"Space check/create info: {e}")

          api.upload_folder(
              folder_path="app",
              repo_id=space_repo,
              repo_type="space",
              commit_message="Deploy from CI: sync app/ to Space",
          )
          print(f"Successfully deployed to https://huggingface.co/spaces/{space_repo}")
          PY


# Setup required (one-time, in the GitHub repo's Settings -> Secrets and variables -> Actions):
#   HF_TOKEN        - a Hugging Face access token with "write" permission
#   HF_SPACE_REPO   - target Space, e.g. "your-username/dental-model-demo"
# The Space itself must already exist (created once manually, see SETUP.md) before this workflow can push to it.
