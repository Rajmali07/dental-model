data:
  yaml_path: data/processed/detector/data.yaml
  image_size: 640
  classes:
  - healthy
  - plaque
  - caries
model:
  architecture: yolov8s.pt
  pretrained: true
train:
  epochs: 100
  batch_size: 16
  patience: 30
  device: cuda
  seed: 42
  optimizer: auto
  lr0: 0.01
  workers: 4
output:
  project_dir: models/detector_runs
  run_name: v1
logging:
  tracker: none
