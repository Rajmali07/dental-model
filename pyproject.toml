[project]
name = "dental-model"
version = "0.2.0"
description = "Detector + classifier pipeline for dental caries/plaque images, deployed to Hugging Face"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]

dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.2",
    "timm>=1.0",
    "albumentations>=1.3.0, <=1.3.1",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "gradio>=4.31",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "imagehash>=4.3",
    "grad-cam>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.13",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "ipykernel>=6.29",
    "pre-commit>=3.7",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
